rules = [OrganizeImports]

OrganizeImports {
  blankLines = Auto
  coalesceToWildcardImportThreshold = null
  expandRelative = false
  groupedImports = Keep
  // Group relative Pekko imports with their fully qualified root import.
  groupSeparately = [ByTypeGivens]
  groups = [
    "re:javax?\\.",
    "scala.",
    "*",
    "com.sun.",
    "re:org\\.apache\\.pekko",
    "org.reactivestreams.",
    "io.netty.",
    "org.scalatest.",
    "org.slf4j.",
    "com.typesafe."
  ]
  importSelectorsOrder = Ascii
  importsOrder = Ascii
  removeUnused = true
  targetDialect = StandardLayout
}
